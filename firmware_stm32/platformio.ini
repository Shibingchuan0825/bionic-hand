; STM32G474RE + DengFOC mini + GB2208 + AS5600
;
; The serial protocol is IDENTICAL to the Arduino build, so the entire Python
; side (tracking, mapping, UI, serial layer) keeps working unchanged.  Only the
; firmware is new -- that is the payoff of keeping the protocol hardware-neutral.
;
; SimpleFOC is used as the FOC engine rather than DengFOC_Lib because it is a
; proper PlatformIO library (auto-fetched), MIT-licensed, and has first-class
; STM32G4 + AS5600 support.  DengFOC_Lib is kept as the board-pinout reference.

[env:nucleo_g474re]
; SimpleFOC is pinned to 2.4.0 or newer.  2.3.4 called
; enableTimerClock(TIM_HandleTypeDef*), which the current Arduino STM32 core
; changed to take a TIM_TypeDef*; with 2.3.4 the STM32 driver layer does not
; compile against the core that ships with the default platform.
;
; Pinning the PLATFORM backwards does not work either: ststm32 19.1.0 requires
; framework-arduinoststm32 ~4.21001.0, which is no longer in the registry.
platform = ststm32
board = nucleo_g474re
framework = arduino
monitor_speed = 115200
upload_protocol = stlink
debug_tool = stlink

build_flags =
    -D SERIAL_BAUD=115200
    -D NUM_AXES=1
    ; DengFOC mini pin map -- VERIFY AGAINST YOUR BOARD before flashing.
    ; These are placeholders; wrong values spin the wrong motor or short a phase.
    -D PIN_PWM_A=PA8
    -D PIN_PWM_B=PA9
    -D PIN_PWM_C=PA10
    -D PIN_EN=PB0
    -D PIN_AS5600_SDA=PB7
    -D PIN_AS5600_SCL=PB6

lib_deps =
    askuric/Simple FOC@^2.4.0
